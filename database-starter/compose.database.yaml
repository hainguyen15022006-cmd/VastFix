name: vastfix-local-db
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vastfix_dev
      POSTGRES_USER: vastfix_dev
      POSTGRES_PASSWORD: vastfix_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vastfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastfix_dev -d vastfix_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vastfix_pgdata:
